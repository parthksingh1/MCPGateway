server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Long-lived caching for fingerprinted assets, none for the entry document,
  # so a redeploy is picked up immediately without a hard refresh.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy the console's API calls to the gateway. Keeping them same-origin
  # means the session cookie is first-party and no CORS preflight is involved.
  location ~ ^/(api|auth|v1)/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The live view is server-sent events: buffering would hold every frame
    # until the response looked complete, which for a stream is never.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }

  # Client-side routing: unknown paths are application routes, not 404s.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
