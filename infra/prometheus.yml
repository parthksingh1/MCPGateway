global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: local

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          source: application

  - job_name: otel-collector-internal
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          source: collector

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
