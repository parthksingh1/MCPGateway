server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collects stdout from every container in this compose project. Application
  # logs are pino JSON, so `trace_id` is promoted to a structured label and the
  # log panels in Grafana can link straight into the matching Jaeger trace.
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ['com.docker.compose.project=mcpgateway']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            trace_id: trace_id
            msg: msg
      - labels:
          level:
      - structured_metadata:
          trace_id:
